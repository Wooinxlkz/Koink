[package]
name = "koink"
version = "0.1.2"
description = "Koink — a small ink-blob desktop companion"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "koink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only for now, as requested. Other targets can be added later by
# widening tauri.conf.json's `bundle.targets` and this section.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
