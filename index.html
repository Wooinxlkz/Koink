<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koink</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Shared by both windows (see src-tauri/tauri.conf.json): the small
      "companion" window is transparent/undecorated, so html/body/#root need
      a transparent background there. The big "main" (Studio) window is a
      normal opaque, decorated window — the vendored avatar app draws its
      own background, so transparent html/body here is harmless for it too.
    -->
    <style>
      html, body, #root { height: 100%; background: transparent; }
    </style>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
